
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BEYBLADE X ZUKAN</title>
<style>
:root {
  --bg:#111318;
  --panel:#20232b;
  --accent:#ef4444;
  --text:#ffffff;
  --muted:#a5a9b3;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header {
  padding:28px 18px 20px;
  text-align:center;
  background:linear-gradient(135deg,#292d38,#111318);
}
h1 {
  font-size:30px;
  margin:8px 0;
  letter-spacing:2px;
}
header p {color:var(--muted)}
main {max-width:1100px;margin:auto;padding:18px}
input,select,button {
  border:0;border-radius:10px;padding:12px;
  font-size:15px;
}
input,select {
  background:var(--panel);color:white;
}
.search {width:100%;margin-bottom:12px}
.controls {
  display:flex;gap:10px;flex-wrap:wrap;
  margin-bottom:20px;
}
.controls select {flex:1;min-width:130px}
.themes {display:flex;gap:8px;flex-wrap:wrap}
.theme {
  width:32px;height:32px;border-radius:50%;
  border:2px solid white;cursor:pointer;
}
#count {color:var(--muted);margin:15px 0}
.grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}
.card {
  background:var(--panel);
  border:1px solid #383c46;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
  transition:.2s;
}
.card:active {transform:scale(.97)}
.photo {
  height:145px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#30343e;
  color:#a5a9b3;
  text-align:center;
  font-size:13px;
  padding:10px;
}
.photo img {
  width:100%;height:100%;
  object-fit:contain;
}
.info {padding:12px}
.info h3 {font-size:15px;margin:0 0 8px}
.tag {
  color:var(--accent);
  font-size:12px;
}
button {
  background:var(--accent);
  color:white;
  cursor:pointer;
}
.modal {
  position:fixed;inset:0;
  background:#000c;
  display:none;
  justify-content:center;
  align-items:center;
  padding:15px;
  z-index:10;
}
.modal-content {
  background:var(--panel);
  padding:22px;
  border-radius:18px;
  width:100%;max-width:430px;
  max-height:85vh;overflow:auto;
}
.modal-content .photo {height:220px;border-radius:12px}
.modal-content h2 {margin-top:15px}
.detail-row {
  padding:10px 0;
  border-bottom:1px solid #444;
}
.close {width:100%;margin-top:18px}
footer {
  text-align:center;color:var(--muted);
  padding:30px;font-size:12px;
}
</style>
</head>
<body>

<header>
  <h1>BEYBLADE X</h1>
  <h2>ZUKAN</h2>
  <p>THE ULTIMATE BEYBLADE DATABASE</p>
  <div class="themes">
    <button class="theme" style="background:#ef4444"
      onclick="setTheme('#ef4444')"></button>
    <button class="theme" style="background:#38bdf8"
      onclick="setTheme('#38bdf8')"></button>
    <button class="theme" style="background:#eabf45"
      onclick="setTheme('#eabf45')"></button>
    <button class="theme" style="background:#c084fc"
      onclick="setTheme('#c084fc')"></button>
    <button class="theme" style="background:#4ade80"
      onclick="setTheme('#4ade80')"></button>
  </div>
</header>

<main>
  <input id="search" class="search"
    placeholder="🔍 ベイの名前を検索..."
    oninput="render()">

  <div class="controls">
    <select id="type" onchange="render()">
      <option value="all">すべてのタイプ</option>
      <option value="未確認">タイプ未確認</option>
    </select>
    <select id="sort" onchange="render()">
      <option value="default">通常順</option>
      <option value="name">名前順</option>
    </select>
  </div>

  <div id="count"></div>
  <div id="grid" class="grid"></div>
</main>

<div class="modal" id="modal" onclick="closeOutside(event)">
  <div class="modal-content">
    <div id="detail"></div>
    <button class="close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<footer>
  BEYBLADE X ZUKAN<br>
  Fan-made database
</footer>

<script>
const bays = [
  {name:"ウィザードロッド",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ナイトランス",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ヘルズサイズ",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ヘルズネザー",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"シルバーウルフ",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"グローリーワルキューレ",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"メテオドラグーン",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"エアロペガサス",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ワイバーンホバーン",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ブラキオウィップ",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ストームペガシス",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"バレットグリフォン",type:"未確認",parts:"未登録",rarity:"未設定"},
  {name:"ババムートブリッツ",type:"未確認",parts:"未登録",rarity:"未設定"}
];

function setTheme(color) {
  document.documentElement.style.setProperty('--accent',color);
  localStorage.setItem('beyTheme',color);
}

const savedTheme=localStorage.getItem('beyTheme');
if(savedTheme) setTheme(savedTheme);

function render() {
  const query=document.getElementById('search').value.toLowerCase();
  const type=document.getElementById('type').value;
  let list=bays.filter(b =>
    b.name.toLowerCase().includes(query) &&
    (type==='all'||b.type===type)
  );

  if(document.getElementById('sort').value==='name')
    list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));

  document.getElementById('count').textContent=
    '登録ベイ：'+list.length+'種類';

  document.getElementById('grid').innerHTML=list.map(b=>`
    <div class="card" onclick="showDetail('${b.name}')">
      <div class="photo">公式画像準備中</div>
      <div class="info">
        <h3>${b.name}</h3>
        <span class="tag">${b.type}</span>
      </div>
    </div>
  `).join('');
}

function showDetail(name) {
  const b=bays.find(x=>x.name===name);
  document.getElementById('detail').innerHTML=`
    <div class="photo">公式画像準備中</div>
    <h2>${b.name}</h2>
    <div class="detail-row">タイプ：${b.type}</div>
    <div class="detail-row">パーツ構成：${b.parts}</div>
    <div class="detail-row">レア度：${b.rarity}</div>
    <div class="detail-row">攻撃力：未登録</div>
    <div class="detail-row">防御力：未登録</div>
    <div class="detail-row">持久力：未登録</div>
    <div class="detail-row">バランス：未登録</div>
  `;
  document.getElementById('modal').style.display='flex';
}

function closeModal() {
  document.getElementById('modal').style.display='none';
}
function closeOutside(e) {
  if(e.target.id==='modal') closeModal();
}
render();
</script>
</body>
</html>
