<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BEYBLADE X ZUKAN</title>

<style>

:root {

  --main:#e53935;

  --bg:#101116;

  --card:#1d2029;

  --text:#fff;

  --sub:#aeb4c2;

}

* { box-sizing:border-box; }

body {

  margin:0;

  background:var(--bg);

  color:var(--text);

  font-family:Arial,"Noto Sans JP",sans-serif;

}

header {

  padding:24px 16px 18px;

  text-align:center;

  background:linear-gradient(135deg,var(--main),#171923);

}

header h1 {

  margin:0;

  font-size:28px;

  letter-spacing:2px;

}

header p { color:#eee; margin:8px 0 0; }

.controls {

  padding:14px;

  display:grid;

  gap:10px;

  max-width:900px;

  margin:auto;

}

input,select,button {

  font:inherit;

  border-radius:10px;

  padding:12px;

  border:1px solid #414653;

}

input,select {

  background:#252936;

  color:white;

  min-width:0;

}

button {

  cursor:pointer;

  background:var(--main);

  color:white;

  border:0;

  font-weight:bold;

}

.themes {

  display:flex;

  gap:8px;

  justify-content:center;

  flex-wrap:wrap;

}

.theme {

  width:34px;

  height:34px;

  padding:0;

  border:2px solid white;

  border-radius:50%;

}

#count {

  text-align:center;

  color:var(--sub);

  padding:4px;

}

.grid {

  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:12px;

  padding:12px;

  max-width:1000px;

  margin:auto;

}

.bey {

  background:var(--card);

  border:1px solid #343a49;

  border-radius:14px;

  padding:10px;

  cursor:pointer;

  min-width:0;

}

.bey:active { transform:scale(.98); }

.card-image {

  width:100%;

  aspect-ratio:1/1;

  object-fit:contain;

  background:#11141b;

  border-radius:10px;

}

.placeholder {

  width:100%;

  aspect-ratio:1/1;

  background:#11141b;

  border-radius:10px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#929aaa;

  font-size:13px;

  text-align:center;

}

.bey h3 {

  margin:10px 0 5px;

  font-size:15px;

}

.small-stats {

  color:var(--sub);

  font-size:12px;

  line-height:1.7;

}

.modal {

  display:none;

  position:fixed;

  inset:0;

  z-index:10;

  background:#000c;

  overflow-y:auto;

  padding:18px 10px;

}

.modal-content {

  background:#202430;

  border:1px solid #454b5a;

  border-radius:16px;

  padding:16px;

  max-width:520px;

  margin:20px auto;

}

.detail-image {

  width:100%;

  max-height:300px;

  object-fit:contain;

  background:#11141b;

  border-radius:12px;

}

.detail-placeholder {

  min-height:180px;

  display:flex;

  justify-content:center;

  align-items:center;

  color:#929aaa;

  background:#11141b;

  border-radius:12px;

}

.modal h2 { margin:12px 0; }

.part-info {

  color:var(--sub);

  line-height:1.8;

  font-size:14px;

}

.stat {

  margin:15px 0;

}

.stat-top {

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:10px;

}

.stat input[type=number] {

  width:76px;

  padding:7px;

}

.stat input[type=range] {

  width:100%;

  accent-color:var(--main);

  padding:0;

}

.actions {

  display:grid;

  grid-template-columns:1fr 1fr;

  gap:10px;

  margin-top:18px;

}

.close {

  background:#555d6e;

}

.note {

  color:var(--sub);

  font-size:12px;

  line-height:1.6;

}

@media(min-width:650px) {

  .grid { grid-template-columns:repeat(4,minmax(0,1fr)); }

  .controls { grid-template-columns:2fr 1fr 1fr; }

}

</style>

</head>

<body>

<header>

  <h1>BEYBLADE X ZUKAN</h1>

  <p>ベイブレードX 図鑑</p>

</header>

<div class="controls">

  <input id="search" placeholder="ベイの名前を検索..." oninput="render()">

  <select id="filter" onchange="render()">

    <option value="all">すべて表示</option>

    <option value="ready">画像あり</option>

    <option value="missing">画像準備中</option>

  </select>

  <select id="sort" onchange="render()">

    <option value="default">登録順</option>

    <option value="name">名前順</option>

  </select>

</div>

<div class="themes">

  <button class="theme" style="background:#e53935" onclick="setTheme('#e53935')"></button>

  <button class="theme" style="background:#287be0" onclick="setTheme('#287be0')"></button>

  <button class="theme" style="background:#c49a26" onclick="setTheme('#c49a26')"></button>

  <button class="theme" style="background:#8c52d8" onclick="setTheme('#8c52d8')"></button>

  <button class="theme" style="background:#159b68" onclick="setTheme('#159b68')"></button>

</div>

<div id="count"></div>

<main class="grid" id="grid"></main>

<div class="modal" id="modal" onclick="backgroundClose(event)">

  <div class="modal-content">

    <div id="detailPhoto"></div>

    <h2 id="detailName"></h2>

    <div class="part-info">

      <div>ブレード：<span id="bladeName">未登録</span></div>

      <div>ラチェット：<span id="ratchetName">未登録</span></div>

      <div>ビット：<span id="bitName">未登録</span></div>

    </div>

    <p class="note">

      以下は自分用の評価だよ。公式の性能数値ではありません。

      0〜100で自由に設定できます。

    </p>

    <div id="stats"></div>

    <div id="saved" class="note">この端末に自動保存されます。</div>

    <div class="actions">

      <button onclick="resetStats()">評価をリセット</button>

      <button class="close" onclick="closeModal()">閉じる</button>

    </div>

  </div>

</div>

<script>

const beys = [

  {name:"ウィザードロッド",image:"images/wizard-rod.png"},

  {name:"ナイトランス",image:"images/knight-lance.png"},

  {name:"ヘルズサイズ",image:"images/hells-scythe.png"},

  {name:"ヘルズネザー",image:"images/hells-nether.png"},

  {name:"シルバーウルフ",image:"images/silver-wolf.png"},

  {name:"グローリーワルキューレ",image:"images/glory-valkyrie.png"},

  {name:"メテオドラグーン",image:"images/meteor-dragoon.png"},

  {name:"エアロペガサス",image:"images/aero-pegasus.png"},

  {name:"ワイバーンホバーン",image:"images/wyvern-hover.png"},

  {name:"ブラキオウィップ",image:"images/brachio-whip.png"},

  {name:"ストームペガシス",image:"images/storm-pegasis.png"},

  {name:"バレットグリフォン",image:"images/bullet-gryphon.png"},

  {name:"ババムートブリッツ",image:"images/bahamut-blitz.png"}

];

const statNames = [

  ["attack","攻撃"],

  ["defense","防御"],

  ["stamina","持久"],

  ["balance","バランス"]

];

let selected = null;

function getStats(name) {

  const all = JSON.parse(localStorage.getItem("bx_stats") || "{}");

  return all[name] || {

    attack:50, defense:50, stamina:50, balance:50

  };

}

function saveStat(name,key,value) {

  const all = JSON.parse(localStorage.getItem("bx_stats") || "{}");

  if (!all[name]) all[name] = getStats(name);

  all[name][key] = Math.max(0,Math.min(100,Number(value)||0));

  localStorage.setItem("bx_stats",JSON.stringify(all));

  document.getElementById("saved").textContent =

    "保存しました！この端末に記録されています。";

  updateStatDisplay();

}

function imageHTML(bey,detail=false) {

  const className = detail ? "detail-image" : "card-image";

  const placeholderClass = detail ? "detail-placeholder" : "placeholder";

  return `

    <img class="${className}"

      src="${bey.image}"

      alt="${bey.name}"

      onerror="this.outerHTML='<div class=\\'${placeholderClass}\\'>画像準備中</div>'">

  `;

}

function render() {

  const word = document.getElementById("search").value.trim();

  const filter = document.getElementById("filter").value;

  const sort = document.getElementById("sort").value;

  let list = beys.filter(b => b.name.includes(word));

  if (filter === "missing") {

    list = list.filter(b => !hasImage(b));

  }

  if (filter === "ready") {

    list = list.filter(b => hasImage(b));

  }

  if (sort === "name") {

    list.sort((a,b) => a.name.localeCompare(b.name,"ja"));

  }

  document.getElementById("count").textContent =

    `${list.length}種類 登録中`;

  document.getElementById("grid").innerHTML = list.map(b => {

    const s = getStats(b.name);

    return `

      <article class="bey" onclick="showDetail('${b.name}')">

        ${imageHTML(b)}

        <h3>${b.name}</h3>

        <div class="small-stats">

          攻撃 ${s.attack} ・ 防御 ${s.defense}<br>

          持久 ${s.stamina} ・ バランス ${s.balance}

        </div>

      </article>

    `;

  }).join("");

}

function hasImage(bey) {

  // GitHubに画像を追加した後、実際の表示で確認できます。

  // 画像ファイルがまだない場合は読み込み失敗時に準備中になります。

  return false;

}

function showDetail(name) {

  selected = beys.find(b => b.name === name);

  if (!selected) return;

  document.getElementById("detailName").textContent = name;

  document.getElementById("detailPhoto").innerHTML =

    imageHTML(selected,true);

  document.getElementById("modal").style.display = "block";

  document.getElementById("saved").textContent =

    "この端末に自動保存されます。";

  updateStatDisplay();

}

function updateStatDisplay() {

  if (!selected) return;

  const s = getStats(selected.name);

  document.getElementById("stats").innerHTML =

    statNames.map(([key,label]) => `

      <div class="stat">

        <div class="stat-top">

          <strong>${label}</strong>

          <input type="number" min="0" max="100"

            value="${s[key]}"

            onchange="saveStat('${selected.name}','${key}',this.value)">

        </div>

        <input type="range" min="0" max="100"

          value="${s[key]}"

          oninput="saveStat('${selected.name}','${key}',this.value)">

      </div>

    `).join("");

}

function resetStats() {

  if (!selected) return;

  const all = JSON.parse(localStorage.getItem("bx_stats") || "{}");

  all[selected.name] = {

    attack:50, defense:50, stamina:50, balance:50

  };

  localStorage.setItem("bx_stats",JSON.stringify(all));

  updateStatDisplay();

  render();

  document.getElementById("saved").textContent =

    "初期値に戻しました。";

}

function closeModal() {

  document.getElementById("modal").style.display = "none";

  selected = null;

}

function backgroundClose(event) {

  if (event.target.id === "modal") closeModal();

}

function setTheme(color) {

  document.documentElement.style.setProperty("--main",color);

  localStorage.setItem("bx_theme",color);

}

const savedTheme = localStorage.getItem("bx_theme");

if (savedTheme) setTheme(savedTheme);

render();

</script>

</body>

</html>
